server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/storefront.log
module:
  name: storefront
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: false
entities:
  cart:
    collection: carts
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  cart_line:
    collection: cart_lines
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  checkout_session:
    collection: checkout_sessions
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  product_listing:
    collection: product_listings
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  product_price:
    collection: product_prices
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  recovery_invite:
    collection: recovery_invites
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  shopper_party:
    collection: shopper_parties
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  storefront_audit_log:
    collection: storefront_audit_log
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  website_sale_setting:
    collection: website_sale_settings
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
